name: Build Stickman Rescue

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: StickmanRescue-Windows

          - os: ubuntu-latest
            platform: android
            artifact_name: StickmanRescue-Android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Install Haxelibs
        run: |
          haxelib install flixel 5.9.0 --always
          haxelib install flixel-ui --always
          haxelib install flixel-addons 3.3.1 --always
          haxelib install tjson --always
          haxelib install flixel-tools --always
          haxelib install openfl 9.4.1 --always
          haxelib install lime 8.2.2 --always
          haxelib git hxdiscord_rpc https://github.com/MAJigsaw77/hxdiscord_rpc

      - name: Setup hxcpp for Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          curl -L -o hxcpp.zip https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.45/hxcpp-4.3.45.zip
          haxelib install hxcpp.zip
          haxelib set hxcpp 4.3.45

      - name: Compile for Windows
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          haxelib run lime build windows -release

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK and NDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2 platform-tools ndk;25.1.8937393'

      - name: Configure Lime for Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          export ANDROID_SDK="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/25.1.8937393"

          echo "ANDROID_SDK=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"

          haxelib run lime setup android -- \
            --ANDROID_SDK "$ANDROID_SDK" \
            --ANDROID_NDK_DIR "$ANDROID_NDK_ROOT" \
            --JAVA_HOME "$JAVA_HOME"

          haxelib run lime config ANDROID_SDK "$ANDROID_SDK"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Compile for Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          haxelib run lime build android -release

      - name: Debug Android Output
        if: matrix.platform == 'android'
        shell: bash
        run: |
          echo "=== Diretório atual ==="
          pwd

          echo "=== Arquivos na raiz ==="
          ls -la

          echo "=== Procurando arquivos gerados ==="
          find . -maxdepth 8 -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.so" \) -print || true

          echo "=== Procurando pastas export ==="
          find . -maxdepth 5 -type d -name "export" -print || true

      - name: Debug Windows Output
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          Write-Host "=== Diretório atual ==="
          Get-Location

          Write-Host "=== Arquivos na raiz ==="
          Get-ChildItem -Force

          Write-Host "=== Procurando EXE ==="
          Get-ChildItem -Path . -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

          Write-Host "=== Procurando pasta export ==="
          Get-ChildItem -Path . -Recurse -Directory -Filter export -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

      - name: Upload Windows Release
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: StickmanRescue-Windows-Release
          path: StickmanRescue-Windows.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android Release
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: StickmanRescue-Android-Release
          path: StickmanRescue-Android.zip
          if-no-files-found: error
          retention-days: 7
