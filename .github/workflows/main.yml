name: Build Stickman Rescue

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: StickmanRescue-Windows
          - os: ubuntu-latest
            platform: android
            artifact_name: StickmanRescue-Android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Install Haxelibs
        run: |
          haxelib install flixel 5.9.0
          haxelib install flixel-ui
          haxelib install flixel-addons 3.3.1
          haxelib install tjson
          haxelib install flixel-tools
          haxelib install openfl 9.4.1
          haxelib install lime 8.2.2
          haxelib git hxdiscord_rpc https://github.com/MAJigsaw77/hxdiscord_rpc 
          

      - name: Compile for Windows (C++)
        if: matrix.platform == 'windows'
        run: |
          haxelib run lime build windows -release

      - name: Setup Java (Required for Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK and NDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2 platform-tools ndk;25.1.8937393'

      - name: Configure Lime for Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393" >> "$GITHUB_ENV"

          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/25.1.8937393"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"

      - name: Compile for Android (APK)
        if: matrix.platform == 'android'
        shell: bash
        run: |
          haxelib run lime build android -release
          

      - name: Prepare Windows Artifact (ZIP)
        if: matrix.platform == 'windows'
        run: |
          mkdir build_zip
          xcopy export\windows\bin build_zip /E /I /H
          powershell Compress-Archive -Path build_zip\* -DestinationPath StickmanRescue-Windows.zip

      - name: Prepare Android Artifact (ZIP)
        if: matrix.platform == 'android'
        run: |
          mkdir build_zip_android
          xcopy export\android\bin\app\build\outputs\apk\release\*.apk build_zip_android /I
          powershell Compress-Archive -Path build_zip_android\* -DestinationPath StickmanRescue-Android.zip

      - name: Upload Windows Release ZIP
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: StickmanRescue-Windows-Release
          path: StickmanRescue-Windows.zip

      - name: Upload Android Release ZIP
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: StickmanRescue-Android-Release
          path: StickmanRescue-Android.zip
          
